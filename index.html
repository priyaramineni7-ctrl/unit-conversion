<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CONV/ Unit Converter</title>
</head>
<body>

  <header>
    <span>CONV/ UNIT CONVERTER</span>
    <span>v1.0</span>
  </header>

  <nav id="tabs"></nav>

  <section>
    <label for="fromValue">FROM</label>
    <input type="number" id="fromValue" value="1" />
    <select id="fromUnit"></select>
  </section>

  <button id="swapBtn" type="button">&#8645; SWAP</button>

  <section>
    <label for="toValue">TO</label>
    <output id="toValue">0</output>
    <select id="toUnit"></select>
  </section>

  <p id="formula"></p>

</body>
</html>
